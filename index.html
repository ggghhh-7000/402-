<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>詳細內容與資訊導覽</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #ffffff;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      color: #222222;
      margin-bottom: 24px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .nav-btn {
      display: block;
      width: 100%;
      padding: 15px 20px;
      background-color: #2c6e49;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      border-radius: 10px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .nav-btn:hover {
      background-color: #1e4d33;
      transform: translateY(-2px);
    }

    .nav-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>相關資訊與表單連結</h1>
    <div class="btn-group">
      <!-- 按鈕 1 -->
      <a href="/ontxt.txt" class="nav-btn">前往詳細內容與介紹</a>
      
      <!-- 按鈕 2 -->
      <a href="/photo.jpg" class="nav-btn">前往我們的詳細介紹圖片</a>
      
      <!-- 按鈕 3 -->
      <a href="https://github.com/ggghhh-7000/402-/wiki" target="_blank" rel="noopener noreferrer" class="nav-btn">前往工作本詳細介紹頁面</a>
      
      <!-- 按鈕 4 -->
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSfL5aeS_dwhueSkEnDPnbzqmCflyIxHwWDI0IBiKlzW34DO8A/viewform?usp=publish-editor" target="_blank" rel="noopener noreferrer" class="nav-btn">前往表單</a>
    </div>
  </div>

</body>
</html>
