<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能按鈕選單</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f5f5f5;
            margin: 0;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 300px;
        }
        .btn {
            display: block;
            text-align: center;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        /* 按鈕 1 顏色 */
        .btn-txt { background-color: #007bff; }
        .btn-txt:hover { background-color: #0056b3; }
        
        /* 按鈕 2 顏色 */
        .btn-photo { background-color: #28a745; }
        .btn-photo:hover { background-color: #218838; }
        
        /* 按鈕 3 顏色 */
        .btn-github { background-color: #24292e; }
        .btn-github:hover { background-color: #111416; }
    </style>
</head>
<body>

    <div class="btn-container">
        <!-- 1: 前往詳細內容與介紹 -->
        <a href="/ontxt.txt" class="btn btn-txt">1. 前往詳細內容與介紹</a>
        
        <!-- 2: 前往我們的詳細介紹圖片 -->
        <a href="/photo.jpg" class="btn btn-photo">2. 前往我們的詳細介紹圖片</a>
        
        <!-- 3: 前往工作本詳細介紹頁面 -->
        <a href="https://github.com" target="_blank" class="btn btn-github">3. 前往工作本詳細介紹頁面</a>
    </div>

</body>
</html>
